name: monthly-pipeline

on:
  schedule:
    - cron: "0 6 3 * *" # 06:00 UTC on the 3rd of each month (ECB monthly, BIS quarterly)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (offline, synthetic data)
        run: pytest -q
      - name: Extract, validate, transform, publish
        run: PYTHONPATH=src python -m apartment_prices.pipeline
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
